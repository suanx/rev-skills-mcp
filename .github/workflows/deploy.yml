name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build（生成内容模块 + 组装 dist）
        run: node scripts/build.mjs

      # -a overseas = 全球加速但不含中国内地（预设域名 *.edgeone.dev）
      # 若要含中国内地改成 -a global（预设域名 *.edgeone.cool），
      # 注意含中国内地的区域要求自定义域名先完成 ICP 备案。
      # 失败时把脱敏后的日志尾部写成 annotation，便于无日志权限时排查。
      - name: Deploy to EdgeOne Pages（全球加速，不含中国内地）
        env:
          EO_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          # 诊断用：常见命名变体，以及是否被误建成 repository variable
          EO_ALT1: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          EO_ALT2: ${{ secrets.EDGEONE_TOKEN }}
          EO_ALT3: ${{ secrets.EDGEONE_API_TOKENS }}
          EO_VAR1: ${{ vars.EDGEONE_API_TOKEN }}
        run: |
          set +e
          if [ -z "$EO_TOKEN" ]; then
            FOUND=""
            for pair in "secrets.EDGEONE_PAGES_API_TOKEN=$EO_ALT1" "secrets.EDGEONE_TOKEN=$EO_ALT2" "secrets.EDGEONE_API_TOKENS=$EO_ALT3" "vars.EDGEONE_API_TOKEN=$EO_VAR1"; do
              k=${pair%%=*}; v=${pair#*=}
              [ -n "$v" ] && FOUND="$FOUND $k(len=${#v})"
            done
            if [ -n "$FOUND" ]; then
              echo "::error::EDGEONE_API_TOKEN 为空，但检测到已配置的近似命名：$FOUND —— 请改名或告诉我用哪个"
            else
              echo "::error::EDGEONE_API_TOKEN 为空，且常见变体也都为空 —— 大概率没存进 Actions 的 Repository secrets（注意 Secrets 与 Variables 是两个不同入口）"
            fi
            exit 1
          fi
          echo "EDGEONE_API_TOKEN 已注入，长度=${#EO_TOKEN}"

          OUT=$(mktemp)
          npx --yes edgeone@1.6.41 pages deploy ./dist \
            -n rev-skills-android-mcp -t "$EO_TOKEN" -a overseas >"$OUT" 2>&1
          RC=$?
          cat "$OUT"

          if [ $RC -ne 0 ]; then
            MSG=$(sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e "s|$EO_TOKEN|[TOKEN]|g" "$OUT" \
                  | tr '\r' '\n' | grep -v '^\s*$' | tail -20 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error::EdgeOne 部署失败 exit=$RC :: $MSG"
          fi
          exit $RC
